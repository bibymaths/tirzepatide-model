[project]
site_name = "Physiologically based pharmacokinetic (PBPK) model of tirzepatide"
site_url = "https://matthiaskoenig.github.io/tirzepatide-model/"
site_description = "This repository provides the tirzepatide physiologically based pharmacokinetic (PBPK) model: the subcutaneous absorption of tirzepatide, its distribution with albumin into the interstitial space, its proteolytic cleavage, the distribution of its metabolites into a slow tissue pool and their excretion in the urine and the feces."
site_author = "Abhinav Mishra and Matthias König"

copyright = "Copyright &copy; 2025-2026 Abhinav Mishra and Matthias König"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/tirzepatide-model"
repo_name = "matthiaskoenig/tirzepatide-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/tirzepatide-model"
